<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Dreamlight Save Suite v3.9.1</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: #0d1117;
            color: #e6edf3;
            font: 14px Arial
        }

        header {
            height: 58px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border-bottom: 1px solid #30363d;
            position: sticky;
            top: 0;
            background: #0d1117;
            z-index: 5
        }

        button, input, select {
            background: #161b22;
            color: #e6edf3;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 8px
        }

        button {
            cursor: pointer
        }

        .app {
            display: grid;
            grid-template-columns:220px minmax(0, 1fr);
            min-height: calc(100vh - 58px);
            transition: grid-template-columns .18s ease
        }

        .app.menu-hidden {
            grid-template-columns:0 minmax(0, 1fr)
        }

        nav {
            border-right: 1px solid #30363d;
            padding: 12px;
            position: sticky;
            top: 58px;
            height: calc(100vh - 58px);
            overflow-y: auto;
            overflow-x: hidden;
            align-self: start;
            background: #0d1117;
            z-index: 4;
            transition: opacity .15s ease, padding .18s ease, border .18s ease
        }

        nav button {
            display: block;
            width: 100%;
            text-align: left;
            margin: 5px 0;
            white-space: nowrap;
            position: relative;
            transition: background .15s ease, border-color .15s ease, color .15s ease, transform .15s ease
        }

        nav button.active {
            background: #1f6feb;
            border-color: #58a6ff;
            color: #fff;
            font-weight: 700;
            box-shadow: 0 0 0 1px rgba(88, 166, 255, .18), inset 3px 0 0 #fff;
            transform: translateX(2px)
        }

        nav button.active::after {
            content: '●';
            position: absolute;
            right: 9px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 8px;
            color: #fff
        }

        nav button:hover:not(.active) {
            background: #21262d;
            border-color: #484f58
        }

        .app.menu-hidden nav {
            opacity: 0;
            pointer-events: none;
            padding-left: 0;
            padding-right: 0;
            border-right: 0
        }

        main {
            min-width: 0
        }

        #menuToggle {
            flex: 0 0 auto
        }

        .page {
            display: none;
            padding: 18px
        }

        .page.active {
            display: block
        }

        .cards {
            display: grid;
            grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px
        }

        .card, .panel {
            border: 1px solid #30363d;
            background: #161b22;
            border-radius: 9px;
            padding: 12px;
            margin-bottom: 12px
        }

        .muted {
            color: #8b949e
        }

        .good {
            color: #3fb950
        }

        .warn {
            color: #d29922
        }

        table {
            border-collapse: collapse;
            width: 100%
        }

        th, td {
            border-bottom: 1px solid #30363d;
            padding: 7px;
            text-align: left
        }

        td input, td select {
            width: 100%
        }

        .toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px
        }

        .danger {
            color: #ff7b72
        }

        .tree {
            font-family: Consolas, monospace
        }

        .row {
            display: grid;
            grid-template-columns:minmax(320px, 1fr) minmax(180px, 360px);
            gap: 8px;
            padding: 5px;
            border-bottom: 1px solid #21262d
        }

        .row .path {
            color: #79c0ff;
            word-break: break-all
        }

        iframe {
            width: 100%;
            height: calc(100vh - 115px);
            min-height: 520px;
            border: 1px solid #30363d;
            border-radius: 8px;
            background: #0d1117;
            display: block;
        }

        #grid.page.active {
            height: calc(100vh - 72px);
            overflow: hidden;
        }

        #grid.page.active #gridFrame {
            height: calc(100% - 76px);
        }

        .pill {
            padding: 3px 7px;
            border: 1px solid #30363d;
            border-radius: 999px
        }

        .search-results {
            max-height: 220px;
            overflow: auto
        }

        .search-results button {
            width: 100%;
            text-align: left;
            border-radius: 0
        }

        .modal-bg {
            position: fixed;
            inset: 0;
            background: #000a;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50
        }

        .modal-bg.open {
            display: flex
        }

        .modal-card {
            width: min(1050px, 94vw);
            max-height: 90vh;
            overflow: auto;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 16px
        }

        .tabs {
            display: flex;
            gap: 6px;
            border-bottom: 1px solid #30363d;
            margin: 10px 0
        }

        .tabs button.active {
            background: #1f6feb
        }

        .state-pane {
            display: none
        }

        .state-pane.active {
            display: block
        }

        .state-group {
            border: 1px solid #30363d;
            border-radius: 7px;
            margin: 7px 0;
            padding: 7px
        }

        .state-group summary {
            cursor: pointer;
            font-weight: 600
        }

        .state-field {
            display: grid;
            grid-template-columns:minmax(240px, 1fr) minmax(180px, 420px) 70px;
            gap: 7px;
            align-items: center;
            padding: 5px;
            border-bottom: 1px solid #21262d
        }

        .state-field code {
            color: #79c0ff;
            word-break: break-all
        }

        .state-json {
            width: 100%;
            min-height: 430px;
            background: #0d1117;
            color: #e6edf3;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px;
            font: 12px Consolas
        }

        .checklabel {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            border: 1px solid #30363d;
            border-radius: 6px
        }

        .checklabel input {
            width: auto
        }

        .id-lookup-wrap {
            display: flex;
            gap: 6px;
            align-items: center
        }

        .id-lookup-wrap input, .id-lookup-wrap select {
            flex: 1;
            min-width: 0
        }

        .id-lookup-btn {
            flex: 0 0 auto;
            padding: 7px 9px
        }

        .lookup-results {
            max-height: 360px;
            overflow: auto;
            border: 1px solid #30363d;
            border-radius: 7px;
            margin-top: 8px
        }

        .lookup-result {
            display: block;
            width: 100%;
            text-align: left;
            border: 0;
            border-bottom: 1px solid #30363d;
            border-radius: 0;
            padding: 9px 10px;
            background: #0d1117
        }

        .lookup-result:hover {
            background: #1f2937
        }

        .lookup-id {
            font-family: Consolas, monospace;
            color: #8b949e;
            font-size: 12px
        }

        /* Characters: bordered, card-like field layout */
        #characterFields .card, #worldFields .card, #progressFields .card {
            border: 1px solid #3d444d;
            background: #111820;
            box-shadow: 0 1px 0 #0004;
            overflow: hidden
        }

        #characterFields .card > summary, #worldFields .card > summary, #progressFields .card > summary {
            padding: 12px 14px;
            margin: -12px -12px 10px;
            background: #1b222c;
            border-bottom: 1px solid #3d444d;
            cursor: pointer
        }

        #characterFields details details, #worldFields details details, #progressFields details details {
            border: 1px solid #30363d;
            border-radius: 7px;
            margin: 8px 0;
            background: #0f141b;
            overflow: hidden
        }

        #characterFields details details > summary, #worldFields details details > summary, #progressFields details details > summary {
            padding: 8px 10px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            cursor: pointer;
            font-weight: 600;
            color: #c9d1d9
        }

        #characterFields details details > div, #worldFields details details > div, #progressFields details details > div {
            padding: 8px !important
        }

        #characterFields .field, #worldFields .field, #progressFields .field, #toolsFields .field, #petsFields .field {
            display: grid;
            grid-template-columns:minmax(180px, 260px) minmax(240px, 1fr);
            gap: 10px;
            align-items: start;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 9px 10px;
            margin: 6px 0;
            background: #161b22
        }

        #characterFields .field label, #worldFields .field label, #progressFields .field label, #toolsFields .field label, #petsFields .field label {
            font-weight: 600;
            color: #79c0ff;
            padding-top: 8px;
            word-break: break-word
        }

        #characterFields .field input, #characterFields .field select, #worldFields .field input, #worldFields .field select, #progressFields .field input, #progressFields .field select, #toolsFields .field input, #toolsFields .field select, #petsFields .field input, #petsFields .field select {
            width: 100%;
            min-width: 0
        }

        #characterFields .field .muted, #worldFields .field .muted, #progressFields .field .muted, #toolsFields .field .muted, #petsFields .field .muted {
            grid-column: 2;
            border-top: 1px dashed #30363d;
            padding-top: 6px;
            margin-top: 0 !important;
            color: #a5d6ff
        }

        @media (max-width: 760px) {
            #characterFields .field, #worldFields .field, #progressFields .field, #toolsFields .field, #petsFields .field {
                grid-template-columns:1fr
            }

            #characterFields .field .muted, #worldFields .field .muted, #progressFields .field .muted, #toolsFields .field .muted, #petsFields .field .muted {
                grid-column: 1
            }
        }
    </style>
</head>
<body>
<header>
    <button id="menuToggle" type="button" title="Hide navigation menu" aria-expanded="true">☰ Hide Menu</button>
    <strong>Dreamlight Save Suite v3.9.1</strong>
    <button id="loadEncrypted">Load encrypted profile.json</button>
    <input id="encrypted" type="file" style="display:none">
    <button id="download" disabled>Download modified JSON</button>
    <span id="status" class="muted">Load a save to begin</span></header>
<div class="app" id="appShell">
    <nav id="sideMenu">
        <button data-page="home">Dashboard</button>
        <button data-page="inventory">Containers</button>
        <button data-page="lists">Lists</button>
        <button data-page="player">Player & Currency</button>
        <button data-page="tools">Tools</button>
        <button data-page="pets">Pets / Assigned Pets</button>
        <button data-page="characters">Characters</button>
        <button data-page="world">World / Buildings</button>
        <button data-page="collections">Collections & Progress</button>
        <button data-page="other">All Editable Fields</button>
        <button data-page="raw">Raw JSON</button>
        <button data-page="grid">Grid Map</button>
    </nav>
    <main>
        <div id="pageMount"></div>

    </main>
</div>
<div id="idLookupModal" class="modal-bg">
    <div class="modal-card" style="width:min(760px,94vw)">
        <div class="toolbar" style="justify-content:space-between;align-items:center">
            <div><h3 id="idLookupTitle" style="margin:0">Find Item / ID</h3>
                <div class="muted" style="margin-top:4px">Search the bundled Item ID list by ID or name.</div>
            </div>
            <button id="idLookupClose">Close</button>
        </div>
        <input id="idLookupSearch" placeholder="Type an Item ID or name..." autocomplete="off" style="width:100%">
        <div id="idLookupResults" class="lookup-results"></div>
    </div>
</div>
<div id="invStateModal" class="modal-bg">
    <div class="modal-card"><h2 id="invStateTitle">Inventory Item State</h2>
        <div class="muted" id="invStateInfo"></div>
        <div class="tabs">
            <button id="invStateFormTab" class="active">State Form</button>
            <button id="invStateJsonTab">State JSON</button>
        </div>
        <div id="invStateFormPane" class="state-pane active">
            <div class="toolbar">
                <button id="invStateAddRoot">Add root field</button>
                <button id="invStateClear">Set State to null</button>
            </div>
            <div id="invStateForm"></div>
        </div>
        <div id="invStateJsonPane" class="state-pane"><textarea id="invStateJson" class="state-json"></textarea></div>
        <div class="toolbar" style="justify-content:flex-end;margin-top:12px">
            <button id="invStateCancel">Cancel</button>
            <button id="invStateApply">Apply State</button>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="/js/app.js" defer></script>
</body>
</html>
